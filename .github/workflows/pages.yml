name: Pages — Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      # vinext build output: dist/client = static assets, dist/server = worker
      # สำหรับ GitHub Pages (static) เราส่ง dist/client ขึ้น Pages
      # ถ้าอยากให้เป็น SSR เต็มรูปแบบ ให้ใช้ Cloudflare Workers แทน (deploy.yml)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
